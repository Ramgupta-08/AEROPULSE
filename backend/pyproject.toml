[project]
name = "aeropulse-backend"
version = "0.1.0"
description = "AeroPulse — predictive maintenance & fleet availability API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "shap>=0.46",
  "ortools>=9.10",
  "apscheduler>=3.10",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "anthropic>=0.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
